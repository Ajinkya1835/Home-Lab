# Drop into /etc/ssh/sshd_config.d/ - verify with: sudo sshd -T | grep -Ei 'password|root|auth'
# Only do this AFTER your public key works, and keep a second session open while testing.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowUsers your-admin-user
