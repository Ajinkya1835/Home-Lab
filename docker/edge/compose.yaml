# The only service meant for the public internet (Tailscale Funnel -> :8480). Static files only.
services:
  edge:
    image: nginx:${NGINX_VERSION:-alpine}
    container_name: edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../demo:/usr/share/nginx/html/portfolio:ro   # the static demo from this repo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/portfolio/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
