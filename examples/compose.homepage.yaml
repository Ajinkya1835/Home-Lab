# Hardened Homepage stack, ready to copy.
# Swaps to make: hostnames in HOMEPAGE_ALLOWED_HOSTS, external network names, and the
# service paths you actually run.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"          # never bind the dashboard to 0.0.0.0
    volumes:
      - ./config:/app/config
      # Bind individual files. Mounting a directory over /app/public hides the image's
      # own locales/ and assets, and every UI label renders as a raw i18n key.
      - ./public/favicon.ico:/app/public/favicon.ico:ro
      - ./public/icon-192.png:/app/public/icon-192.png:ro
      - ./public/status.json:/app/public/status.json:ro
      # read-only: widgets inspect containers, they never write
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homelab.example.ts.net:8450,localhost:3030,127.0.0.1:3030
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - netdata
networks:
  netdata:
    name: netdata_default
    external: true
