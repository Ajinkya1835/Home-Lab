services:
  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "true"
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_EDITOR_BASE_URL: ${N8N_BASE_URL:?set in .env}
      WEBHOOK_URL: ${N8N_BASE_URL}/
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  n8n_data:
